version: 2

updates:
  # Keeps the SHA-pinned Actions moving: deps-autoupdate.yml only covers the
  # packages in deps-config.mjs, and a pinned SHA never updates itself.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # One PR a week for all Actions instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies

  # The lockfile validator's pinned tools (.github/package.json).
  - package-ecosystem: npm
    directory: "/.github"
    schedule:
      interval: weekly
    groups:
      validator-tools:
        patterns:
          - "*"
    labels:
      - dependencies
