name: Dependency Auto Update

# Daily flow: detect newer leaflet/typescript/vite versions, gate each group
# with build + e2e (visual diff vs pre-update main + runtime error check),
# open a PR with the passing updates, and — when every group passed — arm
# auto-merge (GitHub merges once CI passes on the PR); CI then runs on main,
# the Release workflow tags + publishes, and the Pages workflow redeploys
# the demo — all automatically.
# Slack is notified either way: merged, or why not.
# On any failure nothing is merged: a fully-failed run pushes nothing at all,
# and a partially-failed run leaves its PR (passing groups only) open for
# human review — Slack gets the details in both cases.
# Quiet days send nothing, except a heartbeat every 10th day proving the
# schedule is still alive.
#
# Two jobs on purpose: `update` installs and executes freshly-published
# third-party code, so it gets a read-only token and no secrets — code that
# runs there can steal nothing, even when a malicious version fails its gate
# after already executing at build time. Only `publish`, a fresh runner that
# executes nothing the update produced, sees PR_TOKEN, the Slack webhook and
# a write token. The jobs exchange a fixed list of result files, never code.

"on":
  schedule:
    - cron: "0 21 * * *" # 6:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all checks but skip PR creation"
        type: boolean
        default: false

concurrency:
  group: deps-autoupdate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      delta: ${{ steps.update.outputs.delta }}
      next_version: ${{ steps.update.outputs.next_version }}
      failed_groups: ${{ steps.update.outputs.failed_groups }}
      failed_stage: ${{ steps.stage.outputs.failed_stage }}
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolve main at fetch time, not event time: a queued run must not
          # re-apply updates that a previous run already turned into a PR.
          ref: main
          fetch-depth: 0
          # This job builds and tests freshly-updated third-party code; do
          # not leave even the read-only token in .git/config where that code
          # could find it.
          persist-credentials: false

      # The main commit this run tests against. The publish job checks main
      # has not moved since, so a same-window push is never silently reverted.
      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Installs the pnpm version pinned in package.json's packageManager
      # field. Third-party action pinned to a commit SHA.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install deps (base)
        id: install_base
        run: pnpm install --frozen-lockfile

      - name: Build (base)
        id: build_base
        run: pnpm run build

      - name: Install Playwright browsers
        id: browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Baseline screenshots from current main
        id: baseline
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots

      # "Before" comparison image: the pre-update render. Captured now because
      # the post-update --update-snapshots below overwrites the same snapshot
      # file. Committed to the PR branch and embedded in the PR body via a
      # bot-branch raw URL (see writePrBody in deps-check-and-update.mjs).
      - name: Capture "before" comparison image
        id: before_img
        run: |
          mkdir -p e2e/screenshots
          cp .playwright-snapshots/visual.spec.ts-snapshots/map-*.png e2e/screenshots/before.png

      # Updates each dependency group, gates it with build + e2e (rolling back
      # groups that fail), bumps the project version, rewrites README versions,
      # and writes artifacts/pr-body.md. Emits step outputs: changed / delta /
      # prev_version / next_version / updated_packages / failed_groups.
      - name: Update dependencies
        id: update
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Whether the publish job can actually merge — lets the PR body
          # tell the truth instead of promising a merge that the missing
          # PR_TOKEN would skip. A derived boolean only: the token itself
          # never enters this job.
          AUTO_MERGE: ${{ secrets.PR_TOKEN != '' }}
        run: node .github/scripts/deps-check-and-update.mjs

      # "After" comparison image: the post-update render. Both images are
      # committed to the PR branch and embedded in the PR body via bot-branch
      # raw URLs. The committed fixture tiles (e2e/fixtures/tiles) make the
      # render deterministic, so before.png and after.png differ only when the
      # update actually changed the rendering — in which case GitHub's image
      # diff viewers (2-up / swipe / onion skin) also apply under Files changed.
      - name: Capture "after" comparison image
        id: after_img
        if: steps.update.outputs.changed == 'true'
        # Rebuild first: rolling back a failed group restores package.json and
        # node_modules but not dist/, so without this the preview server could
        # render the rejected group's build instead of what the PR ships.
        run: |
          pnpm run build
          pnpm exec playwright test e2e/visual.spec.ts --update-snapshots
          mkdir -p e2e/screenshots
          cp .playwright-snapshots/visual.spec.ts-snapshots/map-*.png e2e/screenshots/after.png

      # The fixed set of result files the publish job may commit. Data only —
      # the publish job never executes anything from this artifact.
      - name: Hand the result files to the publish job
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-update-result
          path: |
            package.json
            pnpm-lock.yaml
            README.md
            e2e/screenshots/before.png
            e2e/screenshots/after.png
            artifacts/pr-body.md
          if-no-files-found: error
          retention-days: 1

      - name: Upload artifacts
        if: ${{ always() && (failure() || steps.update.outputs.changed == 'true' || steps.update.outputs.failed_groups != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-update-artifacts
          path: |
            artifacts/
            test-results/
            playwright-report/
            .playwright-snapshots/
          if-no-files-found: ignore
          retention-days: 14
          # Without this, dot-directories like .playwright-snapshots are
          # silently dropped from the artifact (upload-artifact default).
          include-hidden-files: true

      # Fold this job's step outcomes into one output, so the publish job's
      # Slack message can name the failing stage.
      - name: Report the failing stage
        id: stage
        if: always()
        env:
          O_INSTALL_BASE: ${{ steps.install_base.outcome }}
          O_BUILD_BASE: ${{ steps.build_base.outcome }}
          O_BROWSERS: ${{ steps.browsers.outcome }}
          O_BASELINE: ${{ steps.baseline.outcome }}
          O_BEFORE_IMG: ${{ steps.before_img.outcome }}
          O_UPDATE: ${{ steps.update.outcome }}
          O_AFTER_IMG: ${{ steps.after_img.outcome }}
        run: |
          stage=""
          if   [ "$O_INSTALL_BASE" = "failure" ]; then stage="install-base"
          elif [ "$O_BUILD_BASE"   = "failure" ]; then stage="build-base"
          elif [ "$O_BROWSERS"     = "failure" ]; then stage="playwright-install"
          elif [ "$O_BASELINE"     = "failure" ]; then stage="baseline"
          elif [ "$O_BEFORE_IMG"   = "failure" ]; then stage="before-image"
          elif [ "$O_UPDATE"       = "failure" ]; then stage="update"
          elif [ "$O_AFTER_IMG"    = "failure" ]; then stage="after-image"
          fi
          echo "failed_stage=$stage" >> "$GITHUB_OUTPUT"

  publish:
    needs: update
    # always(): the Slack notification below must also fire when the update
    # job failed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that sees PR_TOKEN, the Slack webhook and a write token.
    # It executes nothing the update job produced — result files are data.
    permissions:
      contents: write
      pull-requests: write
      actions: write # keepalive re-enables this schedule via API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Create Pull Request pushes with its own token input.
          persist-credentials: false

      # If main moved while the update job was running (up to 45 min), the
      # result files were generated against an older main and would silently
      # revert whatever landed in between. Fail closed; the next daily run
      # starts fresh from the new main.
      - name: Base commit unchanged
        id: base_check
        if: needs.update.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ needs.update.outputs.base_sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$BASE_SHA" ]; then
            echo "::error::main moved from $BASE_SHA to $HEAD_SHA during the update; skipping."
            exit 1
          fi

      - name: Fetch the result files
        if: needs.update.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-update-result
          path: incoming

      # The result files are attacker-influenced data (the update job runs
      # freshly-published deps). Validate them with trusted main-side code
      # before they can reach the PR — see verify-update.mjs.
      - name: Verify the result files
        id: verify
        if: needs.update.outputs.changed == 'true'
        run: node .github/scripts/verify-update.mjs incoming

      # A fixed copy list, not a patch: only these six known paths can reach
      # the PR, whatever the artifact contains.
      - name: Apply the result files
        if: needs.update.outputs.changed == 'true'
        run: |
          cp incoming/package.json package.json
          cp incoming/pnpm-lock.yaml pnpm-lock.yaml
          cp incoming/README.md README.md
          mkdir -p e2e/screenshots artifacts
          cp incoming/e2e/screenshots/before.png e2e/screenshots/
          cp incoming/e2e/screenshots/after.png e2e/screenshots/
          cp incoming/artifacts/pr-body.md artifacts/
          rm -rf incoming

      - name: Create Pull Request
        id: cpr
        if: needs.update.outputs.changed == 'true' && inputs.dry_run != true
        # Third-party action pinned to a commit SHA — this workflow's token
        # can write contents, so a hijacked tag must not be able to swap the
        # code underneath us.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # github.token works because "Allow GitHub Actions to create and
          # approve pull requests" is enabled. secrets.PR_TOKEN (fine-grained
          # PAT) additionally lets CI run on the bot PR and is required for
          # the Auto-merge step below — see its comment.
          token: ${{ secrets.PR_TOKEN || github.token }}
          branch: bot/deps-update
          delete-branch: true
          title: "chore: bump deps to v${{ needs.update.outputs.next_version }} (${{ needs.update.outputs.delta }})"
          commit-message: "chore: bump deps to v${{ needs.update.outputs.next_version }} (${{ needs.update.outputs.delta }})"
          body-path: artifacts/pr-body.md
          labels: dependencies
          add-paths: |
            package.json
            pnpm-lock.yaml
            README.md
            e2e/screenshots/before.png
            e2e/screenshots/after.png

      # Every update in the PR already passed build + e2e in the update job.
      # A fully-passing run arms GitHub's auto-merge: the PR then merges as
      # soon as the required CI check passes on it (branch protection),
      # giving a second, independent gate on the exact merge candidate.
      # Uses secrets.PR_TOKEN only, never github.token: GitHub suppresses
      # events from pushes made with github.token, so the merge commit would
      # trigger neither CI (→ no Release) nor Pages — the chain this repo
      # relies on. Without PR_TOKEN the PR is left open for a human and
      # Slack says so. Skipped when any group was excluded: that PR needs a
      # human to review the exclusions before merging. Branch cleanup after
      # the merge is handled by the repository setting "Automatically delete
      # head branches" (or by the next run's delete-branch pass).
      #
      # No direct-merge fallback on purpose: if arming auto-merge fails, the
      # only way a plain merge could still succeed is if the required CI
      # check were not enforced — exactly the case we must not merge in. So
      # a failure here fails the job and leaves the PR open (Slack says so).
      - name: Auto-merge PR
        id: automerge
        if: >-
          steps.cpr.outputs.pull-request-url != '' &&
          needs.update.outputs.failed_groups == ''
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "skipped=no-token" >> "$GITHUB_OUTPUT"
            echo "::warning::secrets.PR_TOKEN is not set; auto-merge skipped. Merge manually: $PR_URL"
            exit 0
          fi
          gh pr merge "$PR_URL" --auto --merge
          echo "armed=true" >> "$GITHUB_OUTPUT"

      # Message logic (including the 10-day heartbeat) lives in
      # .github/scripts/notify-slack.sh; this step only maps the update job's
      # results and this job's step results into its environment.
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHANGED: ${{ needs.update.outputs.changed }}
          DELTA: ${{ needs.update.outputs.delta }}
          NEXT_VERSION: ${{ needs.update.outputs.next_version }}
          FAILED_GROUPS: ${{ needs.update.outputs.failed_groups }}
          FAILED_STAGE: ${{ needs.update.outputs.failed_stage }}
          UPDATE_RESULT: ${{ needs.update.result }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          DRY_RUN: ${{ inputs.dry_run }}
          O_BASE_CHECK: ${{ steps.base_check.outcome }}
          O_VERIFY: ${{ steps.verify.outcome }}
          O_CPR: ${{ steps.cpr.outcome }}
          O_AUTOMERGE: ${{ steps.automerge.outcome }}
          MERGED: ${{ steps.automerge.outputs.merged }}
          ARMED: ${{ steps.automerge.outputs.armed }}
          MERGE_SKIPPED: ${{ steps.automerge.outputs.skipped }}
          # Catch-all for steps the stage map doesn't know: a red job must
          # never be reported as success or silence (see notify-slack.sh).
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/notify-slack.sh

      - name: Fail run if some groups were excluded
        if: needs.update.outputs.failed_groups != ''
        env:
          FAILED_GROUPS: ${{ needs.update.outputs.failed_groups }}
        run: |
          echo "::error::Dependency groups failed checks: $FAILED_GROUPS"
          exit 1

      # GitHub disables cron workflows after 60 days without repo activity;
      # re-enabling this workflow via the Actions API resets that timer.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/deps-autoupdate.yml/enable" \
            || echo "::warning::Keepalive failed; the schedule may be disabled after 60 idle days"
