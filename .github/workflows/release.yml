name: Release

"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ main ]

permissions:
  contents: write

# One release at a time: two overlapping runs could both see the tag missing
# and race to push it. cancel-in-progress: false so a queued run still gets
# to tag its own commit rather than being dropped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # This job holds a contents:write token, so it must only ever act on this
    # repository's own main pushes. A fork PR whose head branch is named
    # "main" also matches the branches filter above; without the event and
    # head_repository checks its code would run here with write access — the
    # pwn-request pattern GitHub warns about in the Secure use reference.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          # Credentials stay persisted on purpose: the Create tag step pushes
          # with them, and this job runs no third-party project code.
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Fails the run if package.json holds anything but a plain version
      # number, so nothing unexpected reaches the shell steps below.
      - name: Read versions from package.json
        id: v
        run: node .github/scripts/read-versions.mjs >> "$GITHUB_OUTPUT"

      # Tag and Release are checked separately so the two steps can recover
      # independently: if the tag pushed but the Release action then failed,
      # the next main run re-creates only the missing Release instead of
      # skipping both because the tag now exists.
      - name: Check tag and release existence
        id: tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # refs/tags/ so a branch or file of the same name cannot answer for
          # the tag.
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.tag.outputs.release_exists != 'true'
        # Third-party action pinned to a commit SHA; it runs with a
        # contents:write token.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        # with: inputs reach the action as data, never a shell, so expressions
        # are safe here.
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          body: |
            - Leaflet v${{ steps.v.outputs.leaflet }}
            - TypeScript v${{ steps.v.outputs.typescript }}
            - Vite v${{ steps.v.outputs.vite }}
