name: Deploy GitHub Pages

# Builds from source and deploys to GitHub Pages after CI succeeds on main,
# so the published demo can never go stale relative to the merged code and a
# commit that fails CI is never published. The repository's Pages settings
# must have "GitHub Actions" as the source.

"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Same guard as the Release workflow: only this repository's own main
    # pushes may reach the deploy job (a fork PR whose head branch is named
    # "main" also matches the branches filter above). workflow_dispatch stays
    # available for a manual redeploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI just validated; for a manual run, the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Nothing here pushes; keep the token out of .git/config during the
          # dependency build.
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager
      # field. Third-party action pinned to a commit SHA.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build with the Pages base path
        env:
          # Project pages are served under /<repo-name>/ — derive it instead
          # of hardcoding so forks deploy without edits.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Separate job so the deploy token never sits on the runner that installs
  # and builds third-party dependencies. configure-pages lives here because
  # it reads the Pages settings and the build job has no pages permission.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
