name: Deploy GitHub Pages

# Builds from source and deploys to GitHub Pages after CI succeeds on main,
# so the published demo can never go stale relative to the merged code and a
# commit that fails CI is never published. The repository's Pages settings
# must have "GitHub Actions" as the source.

"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Same guard as the Release workflow: only this repository's own main
    # pushes may reach the deploy job (a fork PR whose head branch is named
    # "main" also matches the branches filter above). workflow_dispatch stays
    # available for a manual redeploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit CI just validated; for a manual run, the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Nothing here pushes; keep the token out of .git/config during the
          # dependency build.
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager
      # field. Third-party action pinned to a commit SHA (v4).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build with the Pages base path
        env:
          # Project pages are served under /<repo-name>/ — derive it instead
          # of hardcoding so forks deploy without edits.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  # Separate job so the deploy token never sits on the runner that installs
  # and builds third-party dependencies. configure-pages lives here because
  # it reads the Pages settings and the build job has no pages permission.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
