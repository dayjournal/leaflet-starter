name: CI

"on":
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes; keep the token out of .git/config while
          # building and testing PR code.
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager
      # field. Third-party action pinned to a commit SHA (v4).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # E2E smoke (no snapshot baseline required)
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm exec playwright test e2e/smoke.spec.ts

      # The deps auto-update workflow merges its own PRs, so nobody is
      # watching CI on main after those merges — a failure here silently
      # blocks the Release and Pages workflows. Report it to Slack.
      - name: Notify Slack (CI failed on main)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret is not set. Skipped notification."
            exit 0
          fi
          jq -n --arg text ":x: leaflet-starter CI failed on main — the release is blocked until this is fixed. The Pages demo deploys on push independently of CI, so it may already be live. $RUN_URL" '{text: $text}' |
            curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" ||
            echo "::warning::Slack notification failed"
