name: CI

"on":
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# One run per pull request; a superseded PR run is cancelled. Pushes to main
# get a group of their own per run, so they never queue behind or cancel each
# other — the Release workflow keys off every main run's conclusion, and a
# pending run in a shared group would be replaced by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes; keep the token out of .git/config while
          # building and testing PR code.
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager
      # field. Third-party action pinned to a commit SHA (v4).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # E2E smoke (no snapshot baseline required)
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm exec playwright test e2e/smoke.spec.ts

      # The deps auto-update workflow merges its own PRs, so nobody is
      # watching CI on main after those merges — a failure here silently
      # blocks the Release workflow. Report it to Slack. always() + status
      # check instead of failure(): the job's timeout-minutes CANCELS the job
      # rather than failing it, and failure() steps don't run on cancellation.
      - name: Notify Slack (CI failed on main)
        if: always() && job.status != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret is not set. Skipped notification."
            exit 0
          fi
          jq -n --arg text ":x: leaflet-starter CI $JOB_STATUS on main — the release is blocked until this is fixed. Pages only deploys after CI passes, so the demo still shows the last good commit. $RUN_URL" '{text: $text}' |
            curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" ||
            echo "::warning::Slack notification failed"
