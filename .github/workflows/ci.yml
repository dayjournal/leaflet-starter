name: CI

"on":
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# One run per pull request; a superseded PR run is cancelled. Pushes to main
# get a group of their own per run, so they never queue behind or cancel each
# other — the Release workflow keys off every main run's conclusion, and a
# pending run in a shared group would be replaced by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; keep the token out of .git/config while
          # building and testing PR code.
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager
      # field. Third-party action pinned to a commit SHA.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # E2E smoke (no snapshot baseline required)
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm exec playwright test e2e/smoke.spec.ts

  # Nobody watches these two runs, so a failure must reach Slack: CI on main
  # (blocks the Release workflow), and CI on the bot deps PR (the armed
  # auto-merge then never fires and the PR quietly stays open). Kept in its
  # own job with no secrets on the build runner: build-and-smoke executes
  # freshly-updated third-party deps, and that runner must never hold the
  # webhook. This job checks nothing out and installs nothing, so jq/curl
  # come from the pristine image.
  notify-failure:
    needs: build-and-smoke
    # always() + result check, not failure(): a job cancelled by its own
    # timeout-minutes reports "cancelled", which failure() would miss.
    if: >-
      always() && needs.build-and-smoke.result != 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.head_ref == 'bot/deps-update'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify Slack (CI failed unattended)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.build-and-smoke.result }}
          ON_MAIN: ${{ github.event_name == 'push' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret is not set. Skipped notification."
            exit 0
          fi
          if [ "$ON_MAIN" = "true" ]; then
            text=":x: leaflet-starter CI $CI_RESULT on main — the release is blocked until this is fixed. Pages only deploys after CI passes, so the demo still shows the last good commit. $RUN_URL"
          else
            text=":x: leaflet-starter CI $CI_RESULT on the bot deps PR — auto-merge will not fire and the PR stays open: ${PR_URL:-$RUN_URL}"
          fi
          jq -n --arg text "$text" '{text: $text}' |
            curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" ||
            echo "::warning::Slack notification failed"
